name: Generate and ingest CMF material images
on:
  workflow_dispatch:
  push:
    paths:
      - 'training/synthetic/generate_png_samples.py'
      - 'training/external/ingest_polyhaven.py'
      - 'training/external/SOURCES.md'
      - '.github/workflows/cmf-images.yml'
concurrency:
  group: cmf-image-ingest
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  generate-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "Pillow>=10,<13"
      - name: Generate 156 original raster samples
        run: python training/synthetic/generate_png_samples.py --output training/image_samples --count 12 --size 192
      - name: Expand CC0 real-material reference staging and provenance
        run: python training/external/ingest_polyhaven.py --output training/external/polyhaven_cc0_staging --limit 280 --per-family 34
      - name: Validate CC0 reference staging and provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('training/external/polyhaven_cc0_staging')
          data=json.loads((p/'provenance.json').read_text())
          valid=[x for x in data if x.get('license')=='CC0' and x.get('review_status') in ('needs_expert_review','reviewed') and (p/x['path']).is_file()]
          assert len(valid)>=35, f'Expected at least 35 validated source entries; got {len(valid)}'
          print(f'{len(valid)} CC0 assets staged with review gate and provenance')
          PY
      - name: Check output sample counts
        run: |
          python - <<'PY'
          from pathlib import Path
          png=list(Path('training/image_samples').rglob('*.png'))
          assert len(png)==156, f'Expected 156 synthetic PNGs, got {len(png)}'
          print('Generated',len(png),'PNG image samples')
          PY
      - name: Upload bundle for download
        uses: actions/upload-artifact@v4
        with:
          name: kumo-cmf-material-training-images
          path: |
            training/image_samples/
            training/external/polyhaven_cc0_staging/
          retention-days: 30
      - name: Commit images and provenance into training
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f training/image_samples training/external/polyhaven_cc0_staging || true
          if git diff --cached --quiet; then
            echo "No new generated images to commit"
          else
            git commit -m "Add generated raster CMF samples and CC0 staging images"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Committed images on main"
                exit 0
              fi
              echo "Non-fast-forward push on attempt ${attempt}; retrying"
              sleep 2
            done
            echo "Unable to push image commit after retries" >&2
            exit 1
          fi
