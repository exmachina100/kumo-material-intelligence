name: Deploy CMF browser prototype
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application tests
        run: npm test
      - name: Assemble static deployment
        run: |
          mkdir -p site/apps site/packages
          cp -R apps/demo site/apps/demo
          cp -R apps/review site/apps/review
          cp -R apps/research site/apps/research
          cp -R packages/cmf-core site/packages/cmf-core
          cp -R packages/material-dna site/packages/material-dna
          cp -R packages/inference-sdk site/packages/inference-sdk
          mkdir -p site/training/external
          cp -R training/external/polyhaven_cc0_staging site/training/external/polyhaven_cc0_staging
          mkdir -p site/models/research
          cp models/research/manifest.json site/models/research/manifest.json
      - name: Stage pinned research-only ONNX model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44160302007 -n materialnet-vision-probe-research-onnx -D site/models/research
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("site/models/research")
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["approved"] is False
          assert manifest["releaseEligible"] is False
          assert manifest["expertReviewed"] is False
          assert manifest["sourceWorkflowRun"]==44160302007
          actual=(root/manifest["weights"]).read_bytes()
          assert len(actual)==manifest["bytes"],"Model size mismatch"
          assert hashlib.sha256(actual).hexdigest()==manifest["sha256"],"Model checksum mismatch"
          labels=json.loads((root/"labels.json").read_text())
          assert labels==manifest["labels"],"Model labels mismatch"
          assert (root/"evaluation.json").is_file(),"Evaluation report missing"
          print("Pinned research model staged with matching SHA-256 and labels")
          PY
      - name: Finalize static website
        run: |
          touch site/.nojekyll
          printf '<meta http-equiv="refresh" content="0; url=apps/demo/"><a href="apps/demo/">Open Kumo CMF</a>' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
