name: Deploy CMF browser prototype
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application tests
        run: npm test
      - name: Install pinned local ONNX browser runtime
        run: npm install --no-save --ignore-scripts onnxruntime-web@1.20.1
      - name: Assemble static deployment
        run: |
          mkdir -p site/apps site/packages
          cp -R apps/demo site/apps/demo
          cp -R apps/review site/apps/review
          cp -R apps/research site/apps/research
          cp -R packages/cmf-core site/packages/cmf-core
          cp -R packages/material-dna site/packages/material-dna
          cp -R packages/inference-sdk site/packages/inference-sdk
          mkdir -p site/training/external
          cp -R training/external/polyhaven_cc0_staging site/training/external/polyhaven_cc0_staging
          cp -R training/external/ambientcg_cc0_staging site/training/external/ambientcg_cc0_staging
          mkdir -p site/vendor/ort
          cp node_modules/onnxruntime-web/dist/ort.min.js site/vendor/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm*.wasm site/vendor/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm*.mjs site/vendor/ort/
          mkdir -p site/models/research site/models/research-expanded
          cp models/research/manifest.json site/models/research/manifest.json
          cp models/research-expanded/manifest.json site/models/research-expanded/manifest.json
      - name: Stage repository-hosted verified research model
        run: |
          cp models/research/vision-probe-research.onnx site/models/research/vision-probe-research.onnx
          cp models/research/labels.json site/models/research/labels.json
          cp models/research/evaluation.json site/models/research/evaluation.json
          cp models/research-expanded/vision-probe-research.onnx site/models/research-expanded/vision-probe-research.onnx
          cp models/research-expanded/labels.json site/models/research-expanded/labels.json
          cp models/research-expanded/evaluation.json site/models/research-expanded/evaluation.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('site/models/research')
          m=json.loads((root/'manifest.json').read_text())
          assert m['approved'] is False and m['releaseEligible'] is False and m['expertReviewed'] is False
          data=(root/m['weights']).read_bytes()
          assert len(data)==m['bytes']
          assert hashlib.sha256(data).hexdigest()==m['sha256']
          assert json.loads((root/'labels.json').read_text())==m['labels']
          assert json.loads((root/'evaluation.json').read_text())['release_eligible'] is False
          # The additional 10-class vision probe is separately opt-in and unapproved.
          expanded=Path('site/models/research-expanded')
          m2=json.loads((expanded/'manifest.json').read_text())
          assert m2['approved'] is False and m2['releaseEligible'] is False and m2['expertReviewed'] is False
          assert len(m2['labels'])==10
          assert m2['dataset']['samples']>=300
          blob=(expanded/m2['weights']).read_bytes()
          assert len(blob)==m2['bytes']
          assert hashlib.sha256(blob).hexdigest()==m2['sha256']
          assert json.loads((expanded/'labels.json').read_text())==m2['labels']
          assert json.loads((expanded/'evaluation.json').read_text())['release_eligible'] is False
          print('Expanded 10-family research ONNX checksum and labels verified')
          print('Research model release checks passed; keeping production classification disabled.')
          assert (Path('site/vendor/ort/ort.min.js')).is_file()
          wasm=list(Path('site/vendor/ort').glob('ort-wasm*.wasm'))
          assert wasm, 'No local ONNX WASM runtime present'
          print('Same-origin ONNX runtime staged:',[p.name for p in wasm])
          PY
      - name: Finalize static website
        run: |
          touch site/.nojekyll
          printf '<meta http-equiv="refresh" content="0; url=apps/demo/"><a href="apps/demo/">Open Kumo CMF</a>' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
