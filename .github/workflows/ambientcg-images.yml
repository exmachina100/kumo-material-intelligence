name: Stage ambientCG CC0 material samples
on:
  workflow_dispatch:
  push:
    paths:
      - 'training/external/ingest_ambientcg.py'
      - '.github/workflows/ambientcg-images.yml'
concurrency:
  group: ambientcg-cc0-import
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "Pillow>=10,<13"
      - name: Fetch official ambientCG v3 CC0 material previews
        run: python training/external/ingest_ambientcg.py --per-family 24
      - name: Audit source images and metadata
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('training/external/ambientcg_cc0_staging')
          rows=json.loads((p/'provenance.json').read_text())
          assert len(rows)>=30, f'Expected at least 30 material references, got {len(rows)}'
          for x in rows:
              assert x['license']=='CC0'
              assert x['source']=='ambientCG'
              assert x['review_status'] in ('needs_expert_review','reviewed')
              assert x['training_family']=='UNREVIEWED' or x['review_status']=='reviewed'
              assert hashlib.sha256((p/x['path']).read_bytes()).hexdigest()==x['sha256']
          print('Staged',len(rows),'audited CC0 source references, unreviewed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ambientcg-cc0-cmf-reference-images
          path: training/external/ambientcg_cc0_staging/
          retention-days: 30
      - name: Commit captured reference assets and provenance to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f training/external/ambientcg_cc0_staging
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage ambientCG CC0 reference images with provenance and review gates'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
